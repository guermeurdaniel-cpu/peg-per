<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fonds">
<title>PEG / PER — suivi</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,sans-serif; background:#0c0c0e; color:#fff; min-height:100vh; padding:env(safe-area-inset-top) 12px 16px; }
  h1 { font-size:15px; color:#8e8e93; text-align:center; margin:10px 0 2px; }
  .note { font-size:11px; color:#636366; margin:2px 4px 10px; text-align:center; }
  .row { background:#1c1c1e; border-radius:12px; padding:10px 12px; margin-top:7px; display:grid; grid-template-columns:1fr 96px; grid-gap:10px; align-items:center; }
  .info { min-width:0; }
  .nm { font-size:13px; font-weight:600; color:#e5e5ea; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { font-size:10px; color:#636366; margin-top:1px; display:flex; gap:6px; align-items:center; }
  .badge { font-size:9px; font-weight:700; letter-spacing:.3px; padding:1px 5px; border-radius:5px; }
  .badge.both { background:#0a3a66; color:#7abaff; }
  .badge.per  { background:#3a2a66; color:#b9a8ff; }
  .sub { font-size:11px; color:#8e8e93; margin-top:3px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .pr { font-size:16px; font-weight:700; color:#fff; }
  .up { color:#30d158; } .down { color:#ff7b72; }
  .err { font-size:11px; color:#ff7b72; }
  .spark { width:96px; height:40px; display:block; }
  .overlay-box { background:#1c1c1e; border-radius:12px; padding:10px; margin-top:14px; }
  .overlay-title { font-size:11px; color:#8e8e93; margin-bottom:6px; }
  .overlay-svg { width:100%; height:260px; display:block; }
  .legend { display:flex; flex-direction:column; gap:2px; margin-top:10px; font-size:11px; color:#aeaeb2; }
  .legend .item { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:7px; cursor:pointer; -webkit-user-select:none; user-select:none; }
  .legend .item.dim { opacity:.4; }
  .legend .item.on { background:#2c2c2e; color:#fff; }
  .legend .swatch { width:18px; height:3px; border-radius:2px; flex:0 0 auto; }
  .legend .lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend-hint { font-size:10px; color:#636366; margin:6px 4px 0; }
  .refresh { display:block; margin:18px auto 0; background:#2c2c2e; color:#0a84ff; border:none; border-radius:10px; padding:8px 16px; font-size:14px; font-weight:600; }
  .scale-note { font-size:10px; color:#636366; margin:10px 4px 0; text-align:center; }
</style>
</head>
<body>
  <h1>PEG / PER — VL et évolution</h1>
  <div class="note">Valeur liquidative et évolution uniquement (pas de montant ni de quantité). Base 100 au 1er jour enregistré.</div>

  <div id="list"></div>

  <div class="overlay-box">
    <div class="overlay-title">Courbes superposées (base 100, échelle commune)</div>
    <div id="overlay"></div>
  </div>

  <div id="scaleNote"></div>
  <button class="refresh" onclick="loadAll()">Actualiser</button>

<script>
// =======================================================
// Les 7 fonds, dans l'ordre d'affichage. scope = "PEG+PER" ou "PER".
// =======================================================
const FONDS = [
  { isin:"QS0009080720", label:"Amundi Label Monetaire ESR - F",          scope:"PEG+PER" },
  { isin:"QS0009099829", label:"Amundi Protect 90 ESR",                   scope:"PEG+PER" },
  { isin:"QS0009080746", label:"Amundi Label Equilibre ESR - F",          scope:"PEG+PER" },
  { isin:"QS0009122746", label:"CPR ES Action Climat - F",                scope:"PEG+PER" },
  { isin:"QS0009080175", label:"Amundi Actions Internationales ESR - F",  scope:"PEG+PER" },
  { isin:"QS0009102334", label:"Amundi Label Harmonie Solidaire ESR - F", scope:"PEG+PER" },
  { isin:"QS0009116219", label:"Amundi Convictions ESR - F (C)",          scope:"PER" }
];
const COLORS = ["#0a84ff","#30d158","#bf5af2","#ff9f0a","#ff7b72","#5e5ce6","#64d2ff"];
// =======================================================

function eur(v){ return v.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:4}); }

// base 100 = PREMIER point enregistre de CETTE serie
function toBase100(values){
  if(!values || values.length<1 || !values[0]) return null;
  return values.map(function(v){ return v/values[0]*100; });
}
function variation(values){ if(!values||values.length<2)return null; return (values[values.length-1]-values[0])/values[0]*100; }
function lastChange(values){ if(!values||values.length<2)return null; const a=values[values.length-2],b=values[values.length-1]; return {diff:b-a,pct:(b-a)/a*100}; }
function pctSpan(p,l){ if(p==null||!isFinite(p))return ""; return '<span class="'+(p>=0?'up':'down')+'">'+l+(p>=0?'+':'')+p.toFixed(2)+'%</span>'; }

function sparkline(values100, gmin, gmax, up){
  if(!values100 || values100.length<2) return '<svg class="spark"></svg>';
  const w=96,h=40,pad=3, range=(gmax-gmin)||1;
  const yOf=function(v){ return h-pad-(v-gmin)/range*(h-2*pad); };
  const pts=values100.map(function(v,i){ return (pad+i*(w-2*pad)/(values100.length-1)).toFixed(1)+","+yOf(v).toFixed(1); }).join(" ");
  const color=up?"#30d158":"#ff7b72";
  let bl="";
  if(gmin<=100 && gmax>=100){ const y=yOf(100).toFixed(1); bl='<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#48484a" stroke-width="1" stroke-dasharray="2,2"/>'; }
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+bl+'<polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+pts+'"/></svg>';
}

// --- Graphique superpose interactif ---
let OV = { series:[], gmin:0, gmax:0 };
let selectedIdx = null;

function niceTicks(min,max,count){
  const span=max-min; if(span<=0) return [min];
  const raw=span/count, mag=Math.pow(10,Math.floor(Math.log10(raw))), norm=raw/mag;
  let step = norm<1.5?1: norm<3?2: norm<7?5:10; step*=mag;
  const start=Math.ceil(min/step)*step, ticks=[];
  for(let v=start; v<=max+1e-9; v+=step) ticks.push(+v.toFixed(6));
  return ticks;
}

function renderOverlay(){
  const el=document.getElementById("overlay");
  const series=OV.series, gmin=OV.gmin, gmax=OV.gmax;
  const maxLen=Math.max.apply(null, series.map(function(s){return s.values?s.values.length:0;}).concat([0]));
  if(maxLen<2){ el.innerHTML='<div class="note">Pas encore assez de points pour tracer les courbes (revenir après quelques jours de robot).</div>'; return; }
  const w=340,h=260,padL=34,padR=8,padT=12,padB=12, range=(gmax-gmin)||1;
  const yOf=function(v){ return h-padB-(v-gmin)/range*(h-padT-padB); };
  const xOf=function(i,n){ return padL+i*(w-padL-padR)/(n-1); };

  // graduations horizontales + valeurs
  let grid="";
  niceTicks(gmin,gmax,4).forEach(function(t){
    const y=yOf(t).toFixed(1), strong=(Math.abs(t-100)<1e-6);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="'+(strong?'#5a5a5e':'#333336')+'" stroke-width="1"'+(strong?' stroke-dasharray="3,3"':'')+'/>';
    grid+='<text x="'+(padL-4)+'" y="'+(parseFloat(y)+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#8e8e93">'+t.toFixed(0)+'</text>';
  });

  function pathFor(s){ const n=s.values.length; return s.values.map(function(v,i){ return xOf(i,n).toFixed(1)+","+yOf(v).toFixed(1); }).join(" "); }

  // courbes non selectionnees d'abord, puis la selectionnee par-dessus
  let lines="";
  series.forEach(function(s,idx){
    if(!s.values||s.values.length<2) return;
    if(selectedIdx!==null && idx===selectedIdx) return;
    const dim=(selectedIdx!==null);
    lines+='<polyline fill="none" stroke="'+s.color+'" stroke-width="'+(dim?1.3:2)+'" opacity="'+(dim?0.22:1)+'" points="'+pathFor(s)+'"/>';
  });
  if(selectedIdx!==null && series[selectedIdx] && series[selectedIdx].values.length>=2){
    const s=series[selectedIdx];
    lines+='<polyline fill="none" stroke="'+s.color+'" stroke-width="3.2" points="'+pathFor(s)+'"/>';
  }

  const svg='<svg class="overlay-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+grid+lines+'</svg>';
  const items=series.map(function(s,idx){
    const cls='item'+(selectedIdx===idx?' on':(selectedIdx!==null?' dim':''));
    return '<div class="'+cls+'" onclick="toggleCurve('+idx+')"><span class="swatch" style="background:'+s.color+'"></span><span class="lbl">'+s.label+'</span></div>';
  }).join("");
  el.innerHTML=svg+'<div class="legend">'+items+'</div><div class="legend-hint">Touchez un fonds pour isoler sa courbe (touchez à nouveau pour tout réafficher).</div>';
}

window.toggleCurve=function(i){ selectedIdx=(selectedIdx===i)?null:i; renderOverlay(); };

function badge(scope){
  if(scope==="PER") return '<span class="badge per">PER</span>';
  return '<span class="badge both">PEG + PER</span>';
}

function rowFund(f, raw, gmin, gmax){
  const moPct=variation(raw), lc=lastChange(raw);
  const lastVal = raw && raw.length ? raw[raw.length-1] : null;
  const valTxt = lastVal!=null ? eur(lastVal) : "—";
  return '<div class="info"><div class="nm">'+f.label+'</div><div class="meta">'+badge(f.scope)+'<span>'+f.isin+'</span></div><div class="sub">'
    +'<span class="pr">'+valTxt+'</span>'+pctSpan(lc?lc.pct:null,"j ")+pctSpan(moPct,"tot ")
    +'</div></div>'+sparkline(toBase100(raw),gmin,gmax,(moPct==null?0:moPct)>=0);
}

async function loadAll(){
  document.getElementById("list").innerHTML='<div class="row"><div class="sub">Chargement...</div></div>';

  let hist={};
  try{
    const hR=await fetch("history.json?t="+Date.now());
    if(hR.ok) hist=await hR.json();
  }catch(e){}

  // Echelle base 100 commune a TOUS les fonds
  let gmin=Infinity, gmax=-Infinity;
  FONDS.forEach(function(f){
    const raw=(hist[f.isin]||[]).map(function(e){return e.value;});
    const b=toBase100(raw);
    if(b) b.forEach(function(v){ if(v<gmin)gmin=v; if(v>gmax)gmax=v; });
  });
  if(!isFinite(gmin)||!isFinite(gmax)||gmin===gmax){ gmin=95; gmax=105; }
  const margin=(gmax-gmin)*0.08 || 1; gmin-=margin; gmax+=margin;

  // Lignes + series pour la superposition
  const box=document.getElementById("list"); box.innerHTML="";
  const overlaySeries=[];
  FONDS.forEach(function(f, idx){
    const raw=(hist[f.isin]||[]).map(function(e){return e.value;});
    const row=document.createElement("div"); row.className="row";
    if(raw.length>=1){
      row.innerHTML=rowFund(f, raw, gmin, gmax);
      overlaySeries.push({label:f.label, values:toBase100(raw), color:COLORS[idx%COLORS.length]});
    } else {
      row.innerHTML='<div class="info"><div class="nm">'+f.label+'</div><div class="meta">'+badge(f.scope)+'<span>'+f.isin+'</span></div><div class="err">Pas encore de donnees — 1er passage du robot en attente</div></div><svg class="spark"></svg>';
    }
    box.appendChild(row);
  });

  OV = { series:overlaySeries, gmin:gmin, gmax:gmax };
  renderOverlay();
  document.getElementById("scaleNote").innerHTML='<div class="scale-note">Base 100 = 1er point de chaque fonds. Echelle commune : '+gmin.toFixed(1)+'-'+gmax.toFixed(1)+'. j=jour, tot=depuis le debut du suivi.</div>';
}

loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
